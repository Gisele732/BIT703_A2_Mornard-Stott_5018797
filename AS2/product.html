<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aotearoa Adventure Gear | Product</title>
    <meta name="description" content="View product details, similar products, and reviews." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/custom-styles.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div>
      <!-- Header -->
      <header class="py-3 border-bottom">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <img
              src="images/logo_jmgwxd/logo_jmgwxd_c_scale,w_320.png"
              alt="Aotearoa Adventure Gear logo"
              class="logo img-fluid"
              style="max-width: 150px"
            />
          </div>

          <nav class="main-nav" aria-label="Main navigation">
            <ul class="nav flex-wrap">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <div class="vr"></div>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <div class="vr"></div>
              <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
              <div class="vr"></div>
              <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
              <div class="vr"></div>
              <li class="nav-item"><a class="nav-link" href="cart.html">Your Cart</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <main>
        <div class="container">
          <!-- Product detail -->
          <section class="border-top">
            <div class="row g-0">
              <!-- Left: product image -->
              <div
                class="col-12 col-lg-6 p-4 p-md-5 d-flex align-items-center justify-content-center
                       panel-divider panel-divider-end panel-divider-bottom"
              >
                <img
                  id="productImage"
                  src="images/image.svg"
                  alt="Product image"
                  class="img-fluid product-hero"
                  style="max-width: 420px"
                />
              </div>

              <!-- Right: product info -->
              <div class="col-12 col-lg-6 p-4 p-md-5 panel-divider panel-divider-bottom">
                <h1 id="productTitle" class="mb-2">Product title</h1>

                <div class="d-flex align-items-center gap-2 mb-4">
                  <span id="productStars" class="stars" aria-label="Product rating"></span>
                  <span id="productReviewCount" class="text-muted small"></span>
                </div>

                <hr class="my-4" />

                <div class="row g-3 align-items-center mb-3">
                  <div class="col-12 col-md-4">
                    <p id="productPrice" class="h3 mb-0">$0</p>
                  </div>

                  <div class="col-12 col-md-8">
                    <label class="visually-hidden" for="model-select">Select model</label>
                    <select id="model-select" class="form-select"></select>
                  </div>
                </div>

                <p id="productDescription" class="text-muted mb-4"></p>

                <hr class="my-4" />

                <button type="button" class="btn btn-primary px-4">Add To Cart</button>
              </div>
            </div>
          </section>

          <!-- Similar Products -->
          <section class="py-5 border-top">
            <h2 class="text-center mb-4">Similar Products</h2>
            <div class="row g-4" id="similarProducts"></div>
          </section>

          <!-- Reviews -->
          <section class="py-5 border-top">
            <h2 class="mb-4">Reviews</h2>
            <div id="reviewsList"></div>
          </section>
        </div>
      </main>

      <!-- Footer -->
      <footer class="site-footer mt-5">
        <div class="p-4 border-top bg-light">
          <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center">
              <nav class="main-nav" aria-label="Main navigation">
                <ul class="nav flex-wrap">
                  <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                  <div class="vr"></div>
                  <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                  <div class="vr"></div>
                  <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
                  <div class="vr"></div>
                  <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
                </ul>
              </nav>
            </div>
          </div>
        </div>

        <div class="bg-light p-2 text-center">
          <div class="container">
            <p class="small mb-0">&#169; Aotearoa Adventure Gear</p>
          </div>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script>
      const PRODUCTS = {
        1: {
          id: 1,
          name: "Kauri Trek Pack",
          price: 420,
          rating: 4,
          reviewCount: 5,
          image: "images/trekpack.png",
          description:
            "Built for multi-day tramps: supportive frame, weather-resistant fabric, and easy-access pockets.",
          models: ["50L", "65L", "75L"],
          reviews: [
            {
              name: "JOHN DOE",
              date: "august 14, 2018",
              rating: 4,
              text:
                "Comfortable under load and the hip belt sits nicely. Great for weekend trips."
            },
            {
              name: "JANE DOE",
              date: "september 02, 2018",
              rating: 3,
              text:
                "Solid pack overall. Would love slightly more padding on the shoulder straps."
            }
          ]
        },
        2: {
          id: 2,
          name: "Ridge Daypack",
          price: 180,
          rating: 5,
          reviewCount: 12,
          image: "images/daypack.png",
          description:
            "Lightweight daypack for day walks, commuting, and quick missions — with room for layers and lunch.",
          models: ["18L", "24L", "30L"],
          reviews: [
            {
              name: "ARIA W",
              date: "june 10, 2019",
              rating: 5,
              text:
                "Perfect size for day walks. Fits water bottle, jacket, and snacks easily."
            },
            {
              name: "MIKE P",
              date: "july 21, 2019",
              rating: 5,
              text:
                "Surprisingly comfy. Great ventilation on the back panel."
            }
          ]
        },
        3: {
          id: 3,
          name: "Alpine Sleeping Bag",
          price: 240,
          rating: 3,
          reviewCount: 8,
          image: "images/sleepingbag.png",
          description:
            "Warm and packable sleeping bag for cool nights. Compresses down small for easy carrying.",
          models: ["Regular", "Long"],
          reviews: [
            {
              name: "SAM K",
              date: "may 04, 2020",
              rating: 3,
              text:
                "Good value. Warm enough in shoulder season with a liner."
            },
            {
              name: "PRIYA N",
              date: "may 19, 2020",
              rating: 3,
              text:
                "Comfortable but I’d recommend a warmer rating for winter alpine nights."
            }
          ]
        },
        4: {
          id: 4,
          name: "Stormproof Tent",
          price: 360,
          rating: 4,
          reviewCount: 10,
          image: "images/tent.png",
          description:
            "Two-person tent designed for NZ conditions: stable poles, fast pitch, and strong rain protection.",
          models: ["2P", "3P"],
          reviews: [
            {
              name: "KATE L",
              date: "november 11, 2021",
              rating: 4,
              text:
                "Handled wind really well. Setup was quick even in bad weather."
            },
            {
              name: "NOAH B",
              date: "december 02, 2021",
              rating: 4,
              text:
                "Great for the price. Vestibule space is handy for packs."
            }
          ]
        },
        5: {
          id: 5,
          name: "Hiking Poles",
          price: 110,
          rating: 3,
          reviewCount: 6,
          image: "images/hikingpoles.png",
          description:
            "Adjustable poles with sturdy locks and comfortable grips — ideal for steep climbs and long descents.",
          models: ["Pair"],
          reviews: [
            {
              name: "ELLA T",
              date: "march 03, 2022",
              rating: 3,
              text:
                "Helped heaps on downhill sections. Locks are fine but need to be tightened properly."
            },
            {
              name: "JOSH M",
              date: "march 20, 2022",
              rating: 3,
              text:
                "Good starter poles. Light enough for regular use."
            }
          ]
        },
        6: {
          id: 6,
          name: "Trail Stove",
          price: 95,
          rating: 5,
          reviewCount: 14,
          image: "images/stove.png",
          description:
            "Compact stove for quick boils and simple camp meals. Packs small and lights easily.",
          models: ["Stove only", "Stove + Pot set"],
          reviews: [
            {
              name: "TAYLA R",
              date: "january 07, 2023",
              rating: 5,
              text:
                "Boils water fast and packs down tiny. Perfect for coffee on the track."
            },
            {
              name: "BEN H",
              date: "january 22, 2023",
              rating: 5,
              text:
                "Reliable ignition and stable base. Great for multi-day trips."
            }
          ]
        }
      };

      function starsHTML(rating) {
        const full = "&#9733;".repeat(Math.max(0, Math.min(5, rating)));
        const empty = "&#9734;".repeat(5 - Math.max(0, Math.min(5, rating)));
        return full + empty;
      }

      function currency(n) {
        return `$${Number(n).toFixed(0)}`;
      }

      function getProductIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("id");
        const id = Number(raw);
        return Number.isFinite(id) && PRODUCTS[id] ? id : 1;
      }

      function renderProduct(product) {
        document.title = `Aotearoa Adventure Gear | ${product.name}`;

        const img = document.getElementById("productImage");
        const title = document.getElementById("productTitle");
        const stars = document.getElementById("productStars");
        const count = document.getElementById("productReviewCount");
        const price = document.getElementById("productPrice");
        const desc = document.getElementById("productDescription");
        const select = document.getElementById("model-select");

        img.src = product.image;
        img.alt = product.name;

        title.textContent = product.name;
        stars.innerHTML = starsHTML(product.rating);
        stars.setAttribute("aria-label", `${product.rating} out of 5 stars`);

        count.textContent = `${product.reviewCount} reviews`;
        price.textContent = currency(product.price);
        desc.textContent = product.description;

        // Models
        select.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.selected = true;
        placeholder.disabled = true;
        placeholder.textContent = "Select Model";
        select.appendChild(placeholder);

        product.models.forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          select.appendChild(opt);
        });
      }

      function renderSimilarProducts(currentId) {
        const wrap = document.getElementById("similarProducts");
        wrap.innerHTML = "";

        const ids = Object.keys(PRODUCTS).map(Number).filter((id) => id !== currentId);
        const similar = ids.slice(0, 3).map((id) => PRODUCTS[id]);

        similar.forEach((p) => {
          const col = document.createElement("div");
          col.className = "col-12 col-md-4";
          col.innerHTML = `
            <a href="product.html?id=${p.id}" class="text-decoration-none text-reset">
              <div class="d-flex align-items-center gap-3">
                <img src="${p.image}" alt="${p.name}" class="img-fluid" style="max-width: 110px" />
                <div>
                  <p class="mb-1 small text-uppercase text-muted">${p.name}</p>
                  <div class="mb-1"><span class="stars">${starsHTML(p.rating)}</span></div>
                  <p class="mb-0">${currency(p.price)}</p>
                </div>
              </div>
            </a>
          `;
          wrap.appendChild(col);
        });
      }

      function renderReviews(product) {
        const wrap = document.getElementById("reviewsList");
        wrap.innerHTML = "";

        product.reviews.forEach((r, idx) => {
          const row = document.createElement("div");
          row.className = `row g-4 align-items-start py-4 ${idx === 0 ? "border-top" : "border-top"}`;
          row.innerHTML = `
            <div class="col-12 col-md-4">
              <div class="d-flex align-items-start gap-3">
                <div class="rounded-circle border d-flex align-items-center justify-content-center"
                     style="width:56px;height:56px" aria-hidden="true">
                  <span class="text-muted">&#128100;</span>
                </div>
                <div>
                  <p class="mb-0 fw-bold">${r.name}</p>
                  <p class="mb-2 text-muted small">${r.date}</p>
                  <div><span class="stars">${starsHTML(r.rating)}</span></div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-8">
              <p class="text-muted mb-0">${r.text}</p>
            </div>
          `;
          wrap.appendChild(row);
        });
      }

      // Init
      (function init() {
        const id = getProductIdFromURL();
        const product = PRODUCTS[id];
        renderProduct(product);
        renderSimilarProducts(id);
        renderReviews(product);
      })();
    </script>
  </body>
</html>
