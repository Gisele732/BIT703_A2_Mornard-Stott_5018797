<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aotearoa Adventure Gear | Product</title>
    <meta name="description" content="View product details, similar products, and reviews." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/custom-styles.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div>
      <!-- Header -->
      <header class="py-3 border-bottom">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <a href="index.html">
                <img
                src="images/logo_jmgwxd/logo_jmgwxd_c_scale,w_320.png"
                alt="Aotearoa Adventure Gear logo"
                class="logo img-fluid"
                style="max-width: 150px"
                />
            </a>
          </div>

           <!-- Top Menu -->
          <nav class="nav" aria-label="Main navigation">
            <a class="nav-link" href="index.html">Home</a>
            <div class="vr"></div>
            <a class="nav-link" href="#">About</a>
            <div class="vr"></div>
            <a class="nav-link active fw-semibold" href="shop.html">Shop</a>
            <div class="vr"></div>
            <a class="nav-link" href="#">Help</a>
            <div class="vr"></div>
            <a class="nav-link" href="cart.html">Your Cart <span class="badge text-bg-secondary ms-1" data-cart-count>0</span></a>
          </nav>
        </div>
      </header>

      <main>
        <div class="container">
          <!-- Product detail -->
          <section class="border-top">
            <div class="row g-0">
              <!-- Left: product image -->
              <div
                class="col-12 col-lg-6 p-4 p-md-5 d-flex align-items-center justify-content-center
                       panel-divider panel-divider-end panel-divider-bottom"
              >
                <img
                  id="productImage"
                  src="images/image.svg"
                  alt="Product image"
                  class="img-fluid product-hero"
                  style="max-width: 420px"
                />
              </div>

              <!-- Right: product info -->
              <div class="col-12 col-lg-6 p-4 p-md-5 panel-divider panel-divider-bottom">
                <h1 id="productTitle" class="mb-2">Product title</h1>

                <div class="d-flex align-items-center gap-2 mb-4">
                  <span id="productStars" class="stars text-secondary" aria-label="Product rating"></span>
                  <span id="productReviewCount" class="text-muted small"></span>
                </div>

                <hr class="my-4" />

                <div class="row g-3 align-items-center mb-3">
                  <div class="col-12 col-md-4">
                    <p id="productPrice" class="h3 mb-0">$0</p>
                  </div>

                  <div class="col-12 col-md-8">
                    <label class="visually-hidden" for="model-select">Select model</label>
                    <select id="model-select" class="form-select"></select>
                  </div>
                </div>

                <p id="productDescription" class="text-muted mb-4"></p>

                <hr class="my-4" />

                <button type="button" class="btn btn-primary" id="addToCartBtn">Add To Cart</button>
              </div>
            </div>
          </section>

        <!-- Scroll to top button -->
        <button onclick="topFunction()" id="myBtn" title="Go to top" class="btn btn-primary rounded-circle">Top</button>

          <!-- Similar Products -->
          <section class="py-5 border-top">
            <h2 class="text-center mb-4">Similar Products</h2>
            <div class="row g-4" id="similarProducts"></div>
          </section>

          <!-- Reviews -->
          <section class="py-5 border-top">
            <h2 class="mb-4">Reviews</h2>
            <div id="reviewsList"></div>
          </section>
        </div>
      </main>

      <!-- Footer -->
      <footer class="site-footer mt-5">
        <div class="p-4 border-top bg-light">
          <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center">
                <nav class="nav" aria-label="Main navigation">
                    <a class="nav-link" href="index.html">Home</a>
                    <div class="vr"></div>
                    <a class="nav-link" href="#">About</a>
                    <div class="vr"></div>
                    <a class="nav-link active fw-semibold" href="shop.html">Shop</a>
                    <div class="vr"></div>
                    <a class="nav-link" href="#">Help</a>
                </nav>
            </div>
          </div>
        </div>

        <div class="bg-light p-2 text-center">
          <div class="container">
            <p class="small mb-0">&#169; Aotearoa Adventure Gear</p>
          </div>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>

    <script>
        /* scroll to top function */
        // Get the button:
        let mybutton = document.getElementById("myBtn");

        // When the user scrolls down 20px from the top of the document, show the button
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            mybutton.style.display = "block";
        } else {
            mybutton.style.display = "none";
        }
        }

        // When the user clicks on the button, scroll to the top of the document
        function topFunction() {
        document.body.scrollTop = 0; // For Safari
        document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
        }

        updateCartCount();

    function starsHTML(rating) {
        const full = "&#9733;".repeat(Math.max(0, Math.min(5, rating)));
        const empty = "&#9734;".repeat(5 - Math.max(0, Math.min(5, rating)));
        return full + empty;
    }

    function currency(n) {
        return `$${Number(n).toFixed(0)}`;
    }

    function getProductIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("id");
        const id = Number(raw);
        return Number.isFinite(id) && PRODUCTS[id] ? id : 1;
    }

    function renderProduct(product) {
        document.title = `Aotearoa Adventure Gear | ${product.name}`;

        const img = document.getElementById("productImage");
        const title = document.getElementById("productTitle");
        const stars = document.getElementById("productStars");
        const count = document.getElementById("productReviewCount");
        const price = document.getElementById("productPrice");
        const desc = document.getElementById("productDescription");
        const select = document.getElementById("model-select");

        img.src = product.image;
        img.alt = product.name;

        title.textContent = product.name;
        stars.innerHTML = starsHTML(product.rating);
        stars.setAttribute("aria-label", `${product.rating} out of 5 stars`);

        count.textContent = `${product.reviewCount} reviews`;
        price.textContent = currency(product.price);
        desc.textContent = product.description;

        // Models
        select.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.selected = true;
        placeholder.disabled = true;
        placeholder.textContent = "Select Model";
        select.appendChild(placeholder);

        product.models.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        select.appendChild(opt);
        });

        // Add-to-cart
        const addBtn = document.getElementById("addToCartBtn");
        addBtn.onclick = () => {
        const chosenModel = select.value && select.value !== "Select Model" ? select.value : null;

        // optional: require model selection
        if (!chosenModel) {
            select.focus();
            return;
        }

        addToCart(product.id, 1, chosenModel);
        window.location.href = "cart.html";
        };
    }

    function renderSimilarProducts(currentId) {
        const wrap = document.getElementById("similarProducts");
        wrap.innerHTML = "";

        const ids = Object.keys(PRODUCTS).map(Number).filter((id) => id !== currentId);
        const similar = ids.slice(0, 3).map((id) => PRODUCTS[id]);

        similar.forEach((p) => {
        const col = document.createElement("div");
        col.className = "col-12 col-md-4";
        col.innerHTML = `
            <a href="product.html?id=${p.id}" class="text-decoration-none text-reset">
            <div class="d-flex align-items-center gap-3">
                <img src="${p.image}" alt="${p.name}" class="img-fluid" style="max-width: 110px" />
                <div>
                <p class="mb-1 small text-uppercase text-muted">${p.name}</p>
                <div class="mb-1"><span class="stars text-secondary">${starsHTML(p.rating)}</span></div>
                <p class="mb-0">${currency(p.price)}</p>
                </div>
            </div>
            </a>
        `;
        wrap.appendChild(col);
        });
    }

    function renderReviews(product) {
        const wrap = document.getElementById("reviewsList");
        wrap.innerHTML = "";

        product.reviews.forEach((r, idx) => {
        const row = document.createElement("div");
        row.className = `row g-4 align-items-start py-4 border-bottom`;
        row.innerHTML = `
            <div class="col-12 col-md-4">
            <div class="d-flex align-items-start gap-3">
                <div class="rounded-circle border d-flex align-items-center justify-content-center"
                    style="width:56px;height:56px" aria-hidden="true">
                <span class="text-muted">&#128100;</span>
                </div>
                <div>
                <p class="mb-0 fw-bold">${r.name}</p>
                <p class="mb-2 text-muted small">${r.date}</p>
                <div><span class="stars text-secondary">${starsHTML(r.rating)}</span></div>
                </div>
            </div>
            </div>
            <div class="col-12 col-md-8">
            <p class="text-muted">${r.text}</p>
            </div>
        `;
        wrap.appendChild(row);
        });
    }

    // Init
    (function init() {
        const id = getProductIdFromURL();
        const product = PRODUCTS[id];

        renderProduct(product);
        renderSimilarProducts(id);
        renderReviews(product);

        updateCartCount(); // optional badge
    })();
    </script>
  </body>
</html>
